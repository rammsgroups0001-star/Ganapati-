<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aryan Trading Classes | Option Trading & Derivatives Education India</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #f6f8fc;
      --surface-glass: rgba(255, 255, 255, 0.78);
      --surface-solid: #ffffff;
      --border-glass: rgba(255, 255, 255, 0.95);
      --border-subtle: rgba(15, 23, 42, 0.08);
      --ink-primary: #0b132b;
      --ink-secondary: #334155;
      --ink-muted: #64748b;
      --brand-blue: #1d4ed8;
      --brand-indigo: #4338ca;
      --brand-emerald: #059669;
      --brand-emerald-bg: #ecfdf5;
      --shadow-ambient: 0 20px 45px -15px rgba(11, 19, 43, 0.08);
      --shadow-card: 0 8px 24px -6px rgba(15, 23, 42, 0.05);
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      color: var(--ink-secondary);
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      line-height: 1.65;
    }

    /* Interactive Institutional Grid Canvas */
    #bg-grid-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      pointer-events: none;
    }

    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      pointer-events: none;
      animation: floatGlow 14s ease-in-out infinite alternate;
    }
    .glow-left {
      width: 460px;
      height: 460px;
      background: rgba(29, 78, 216, 0.11);
      top: -120px;
      left: -100px;
    }
    .glow-right {
      width: 420px;
      height: 420px;
      background: rgba(5, 150, 105, 0.09);
      bottom: 5%;
      right: -90px;
      animation-delay: -6s;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 25px) scale(1.08); }
    }

    /* Static Regulatory Compliance Strip */
    .reg-strip {
      background: #0b132b;
      color: #e2e8f0;
      font-size: 0.76rem;
      padding: 9px 16px;
      text-align: center;
      letter-spacing: 0.25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .reg-strip strong {
      color: #34d399;
      font-weight: 600;
    }

    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Frosted Glass Navigation Bar */
    .navbar-wrap {
      position: sticky;
      top: 14px;
      z-index: 999;
      padding: 0 16px;
      margin-top: 14px;
    }

    .navbar {
      max-width: 1180px;
      margin: 0 auto;
      height: 72px;
      background: var(--surface-glass);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-ambient);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      transition: all 0.35s var(--ease-out-expo);
    }

    .logo-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, #0b132b 0%, #1d4ed8 100%);
      display: grid;
      place-items: center;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 6px 16px rgba(29, 78, 216, 0.28);
      transition: transform 0.4s var(--ease-spring);
    }
    .logo-lockup:hover .logo-mark {
      transform: rotate(-6deg) scale(1.06);
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }
    .logo-text span:first-child {
      font-weight: 800;
      font-size: 1.12rem;
      color: var(--ink-primary);
      letter-spacing: -0.4px;
    }
    .logo-text span:last-child {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--brand-blue);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Navigation Tabs with Sliding Pill Indicator */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
      background: rgba(241, 245, 249, 0.7);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .nav-btn {
      position: relative;
      z-index: 2;
      background: transparent;
      border: none;
      padding: 9px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--ink-secondary);
      border-radius: 10px;
      cursor: pointer;
      transition: color 0.25s ease, transform 0.2s var(--ease-spring);
      white-space: nowrap;
    }
    .nav-btn:hover {
      color: var(--ink-primary);
    }
    .nav-btn:active {
      transform: scale(0.95);
    }
    .nav-btn.active {
      color: #ffffff;
    }

    .nav-pill {
      position: absolute;
      z-index: 1;
      height: calc(100% - 10px);
      top: 5px;
      left: 5px;
      background: linear-gradient(135deg, #0b132b 0%, #1e3a8a 100%);
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(11, 19, 43, 0.2);
      transition: transform 0.38s var(--ease-spring), width 0.38s var(--ease-spring);
    }

    .mobile-burger {
      display: none;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: #fff;
      color: var(--ink-primary);
      font-size: 1.25rem;
      cursor: pointer;
      place-items: center;
      transition: transform 0.25s var(--ease-spring);
    }
    .mobile-burger:active {
      transform: scale(0.9);
    }

    /* Trading Platform Grade Animated Buttons */
    .btn-trade {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 26px;
      border-radius: 13px;
      font-size: 0.94rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: transform 0.3s var(--ease-spring), box-shadow 0.3s ease, background 0.3s ease;
      user-select: none;
    }

    .btn-trade::before {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: skewX(-22deg);
      transition: left 0.65s var(--ease-out-expo);
    }
    .btn-trade:hover::before {
      left: 140%;
    }
    .btn-trade:hover {
      transform: translateY(-2.5px);
    }
    .btn-trade:active {
      transform: translateY(1px) scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      color: #fff;
      box-shadow: 0 10px 24px -6px rgba(29, 78, 216, 0.42);
    }
    .btn-primary:hover {
      box-shadow: 0 14px 28px -6px rgba(29, 78, 216, 0.55);
    }

    .btn-glass {
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink-primary);
      border: 1px solid rgba(15, 23, 42, 0.12);
      box-shadow: var(--shadow-card);
    }
    .btn-glass:hover {
      background: #ffffff;
      border-color: var(--brand-blue);
    }

    .btn-arrow {
      display: inline-block;
      transition: transform 0.3s var(--ease-spring);
    }
    .btn-trade:hover .btn-arrow {
      transform: translateX(4px);
    }

    .ripple-wave {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      transform: scale(0);
      animation: rippleAnim 0.6s linear;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    /* Page Transitions & Reveal Animations */
    #page-viewport {
      padding-top: 28px;
      padding-bottom: 40px;
      min-height: 72vh;
    }

    .page-enter {
      animation: pageSlideUp 0.52s var(--ease-out-expo) forwards;
    }
    @keyframes pageSlideUp {
      from { opacity: 0; transform: translateY(18px) scale(0.992); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .reveal-item {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s var(--ease-out-expo), transform 0.6s var(--ease-out-expo);
    }
    .reveal-item.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Frosted Glass Cards */
    .glass-panel {
      background: var(--surface-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-glass);
      border-radius: 22px;
      padding: 32px;
      box-shadow: var(--shadow-ambient);
      transition: transform 0.35s var(--ease-out-expo), box-shadow 0.35s ease, border-color 0.3s ease;
    }
    .glass-panel:hover {
      border-color: rgba(29, 78, 216, 0.22);
      box-shadow: 0 24px 50px -15px rgba(11, 19, 43, 0.11);
    }

    .pill-tag {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 700;
      background: #eff6ff;
      color: var(--brand-blue);
      border: 1px solid #dbeafe;
      margin-bottom: 16px;
    }
    .pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand-emerald);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2);
    }

    h1 {
      font-size: clamp(2rem, 4.2vw, 3.1rem);
      font-weight: 800;
      color: var(--ink-primary);
      line-height: 1.16;
      letter-spacing: -0.03em;
      margin-bottom: 18px;
    }

    h2 {
      font-size: clamp(1.5rem, 2.8vw, 2.1rem);
      font-weight: 800;
      color: var(--ink-primary);
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    h3 {
      font-size: 1.18rem;
      font-weight: 700;
      color: var(--ink-primary);
      margin-bottom: 8px;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      gap: 28px;
      align-items: center;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 22px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 24px;
    }

    /* Interactive Risk & Position Sizing Simulator */
    .terminal-box {
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.09);
      border-radius: 18px;
      padding: 22px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 1), 0 12px 30px rgba(15, 23, 42, 0.05);
    }

    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid #f1f5f9;
    }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .metric-cell {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      transition: transform 0.25s var(--ease-spring), border-color 0.25s ease;
    }
    .metric-cell:hover {
      transform: translateY(-2px);
      border-color: var(--brand-blue);
    }
    .metric-cell span {
      display: block;
      font-size: 0.72rem;
      color: var(--ink-muted);
      font-weight: 600;
    }
    .metric-cell strong {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem;
      color: var(--ink-primary);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 99px;
      outline: none;
      margin: 12px 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--brand-blue);
      cursor: pointer;
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(29, 78, 216, 0.4);
      transition: transform 0.2s var(--ease-spring);
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0 26px;
    }
    .filter-chip {
      padding: 9px 18px;
      border-radius: 11px;
      border: 1px solid #cbd5e1;
      background: rgba(255, 255, 255, 0.8);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink-secondary);
      cursor: pointer;
      transition: all 0.25s var(--ease-spring);
    }
    .filter-chip:hover {
      border-color: var(--brand-blue);
      color: var(--brand-blue);
    }
    .filter-chip.active {
      background: var(--ink-primary);
      color: #fff;
      border-color: var(--ink-primary);
      transform: translateY(-1px);
    }

    .topic-list {
      list-style: none;
      margin: 16px 0 22px;
    }
    .topic-list li {
      padding: 9px 0;
      border-bottom: 1px dashed #e2e8f0;
      font-size: 0.9rem;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .topic-list li::before {
      content: '→';
      color: var(--brand-blue);
      font-weight: 800;
    }

    .field-group {
      margin-bottom: 16px;
    }
    .field-group label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--ink-primary);
      margin-bottom: 6px;
    }
    .field-control {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: rgba(255, 255, 255, 0.92);
      font-family: inherit;
      font-size: 0.94rem;
      color: var(--ink-primary);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .field-control:focus {
      outline: none;
      border-color: var(--brand-blue);
      box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.12);
    }

    .acc-card {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #e2e8f0;
      border-radius: 15px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: border-color 0.25s ease;
    }
    .acc-card.open {
      border-color: var(--brand-blue);
    }
    .acc-head {
      width: 100%;
      padding: 18px 22px;
      background: none;
      border: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--ink-primary);
      cursor: pointer;
    }
    .acc-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #f1f5f9;
      display: grid;
      place-items: center;
      font-family: 'JetBrains Mono', monospace;
      transition: transform 0.35s var(--ease-spring), background 0.25s ease;
    }
    .acc-card.open .acc-icon {
      transform: rotate(45deg);
      background: var(--brand-blue);
      color: #fff;
    }
    .acc-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s var(--ease-out-expo), padding 0.3s ease;
      padding: 0 22px;
      color: var(--ink-secondary);
      font-size: 0.92rem;
    }
    .acc-card.open .acc-body {
      max-height: 220px;
      padding: 0 22px 18px;
    }

    .site-footer {
      background: #0b132b;
      color: #cbd5e1;
      padding: 48px 0 32px;
      margin-top: 64px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .sebi-notice {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 4px solid #34d399;
      border-radius: 14px;
      padding: 18px 20px;
      font-size: 0.83rem;
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .footer-meta {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 0.82rem;
      color: #94a3b8;
    }

    @media (max-width: 860px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }
      .mobile-burger {
        display: grid;
      }
      .nav-links {
        display: none;
        position: absolute;
        top: 82px;
        left: 16px;
        right: 16px;
        flex-direction: column;
        align-items: stretch;
        background: rgba(255, 255, 255, 0.97);
        backdrop-filter: blur(20px);
        padding: 12px;
        border-radius: 18px;
        box-shadow: 0 24px 48px rgba(11, 19, 43, 0.18);
        border: 1px solid #e2e8f0;
      }
      .nav-links.mobile-open {
        display: flex;
        animation: pageSlideUp 0.3s var(--ease-out-expo);
      }
      .nav-pill {
        display: none;
      }
      .nav-btn.active {
        background: var(--ink-primary);
      }
      .glass-panel {
        padding: 22px;
      }
    }
  </style>
</head>
<body>
  <canvas id="bg-grid-canvas"></canvas>
  <div class="ambient-glow glow-left"></div>
  <div class="ambient-glow glow-right"></div>

  <div class="reg-strip">
    <strong>SEBI COMPLIANCE DISCLOSURE:</strong> Aryan Trading Classes is strictly a Financial Literacy & Option Derivatives Training Institute. No Stock Tips, PMS, or Advisory Services.
  </div>

  <header class="navbar-wrap">
    <div class="navbar">
      <div class="logo-lockup" data-route="home">
        <div class="logo-mark">AT</div>
        <div class="logo-text">
          <span>Aryan Trading Classes</span>
          <span>Derivatives Academy India</span>
        </div>
      </div>
      <nav class="nav-links" id="nav-links">
        <div class="nav-pill" id="nav-pill"></div>
      </nav>
      <button class="mobile-burger" id="mobile-burger" aria-label="Menu">☰</button>
    </div>
  </header>

  <main id="page-viewport" class="shell"></main>

  <footer class="site-footer" id="site-footer"></footer>

  <script>
    /* ==========================================================================
       1. ARYAN TRADING CLASSES CONFIGURATION (Address, Phone, Udyam Edit Karein)
       ========================================================================== */

      ],
      modules: [
        {

          category: "foundation",

          topics: [
            "NSE & BSE Index Option Contract Specifications & Lot Dynamics",

        {

          code: "MOD-02",
          tag: "Core Quantitative • 6 Weeks",
          title: "Option Greeks, India VIX & Open Interest Analysis",
          subtitle: "Learn how institutional desks read option chains, volatility skew, and time decay.",
          topics: [
            "Practical Application of Delta, Gamma, Theta & Vega",
            "India VIX & Implied Volatility (IV) Percentile Assessment",
            "Decoding Option Chain: Long Buildup, Short Covering & Writing Zones",
            "Multi-Timeframe Price Action & Institutional Liquidity Levels"
          ]
        },
        {
          id: "mod-3",
          category: "hedging",
          code: "MOD-03",
          tag: "Risk Architecture • 4 Weeks",
          title: "Defined-Risk Spreads & Capital Preservation",
          subtitle: "Mathematical position sizing and non-directional hedging frameworks.",
          topics: [
            "Bull Call, Bear Put & Iron Condor Payoff Construction",
            "Margin Management & Drawdown Control Protocols",
            "Rule-Based Trade Journaling & Statistical Expectancy",
            "Behavioral Discipline & Eliminating Impulse Execution"
          ]
        }
      ],
      faqs: [
        {
          q: "Does Aryan Trading Classes provide live buy/sell calls, Telegram tips, or guaranteed profit schemes?",
          a: "Strictly No. Aryan Trading Classes is an educational skill-training academy. We teach students how to read NSE Option Chains, calculate Greeks, and manage risk independently. We never issue buy/sell recommendations."
        },

    (function initGridCanvas() {
      const canvas = document.getElementById("bg-grid-canvas");
      const ctx = canvas.getContext("2d");
      let w, h, mouse = { x: -1000, y: -1000 };

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resize);
      window.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });
      resize();

      function draw() {
        ctx.clearRect(0, 0, w, h);
        const step = 44;

        for (let x = 0; x < w; x += step) {
          for (let y = 0; y < h; y += step) {
            const dist = Math.hypot(mouse.x - x, mouse.y - y);
            const alpha = dist < 160 ? 0.16 * (1 - dist / 160) + 0.035 : 0.035;
            ctx.fillStyle = `rgba(29, 78, 216, ${alpha})`;
            ctx.fillRect(x, y, 1.5, 1.5);
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();

       4. ROUTING, SLIDING PILL NAV & INTERACTIVE ENGINE

    const navEl = document.getElementById("nav-links");
    const pillEl = document.getElementById("nav-pill");
    const viewport = document.getElementById("page-viewport");

    function buildNavigation(activeId) {
      navEl.querySelectorAll(".nav-btn").forEach((b) => b.remove());

      INSTITUTE.routes.forEach((r) => {
        const btn = document.createElement("button");
        btn.className = "nav-btn" + (r.id === activeId ? " active" : "");
        btn.textContent = r.label;
        btn.dataset.route = r.id;
        navEl.appendChild(btn);
      });

      requestAnimationFrame(() => updateNavPill(activeId));
    }

    function updateNavPill(activeId) {
      const activeBtn = navEl.querySelector(`.nav-btn[data-route="${activeId}"]`);
      if (!activeBtn || window.innerWidth <= 860) return;
      pillEl.style.width = `${activeBtn.offsetWidth}px`;
      pillEl.style.transform = `translateX(${activeBtn.offsetLeft - 5}px)`;
    }

    function switchPage(routeId) {
      const target = PAGES[routeId] ? routeId : "home";
      buildNavigation(target);

      viewport.classList.remove("page-enter");
      void viewport.offsetWidth;
      viewport.innerHTML = PAGES[target]();
      viewport.classList.add("page-enter");

      navEl.classList.remove("mobile-open");
      window.scrollTo({ top: 0, behavior: "smooth" });

      const reveals = viewport.querySelectorAll(".reveal-item");
      reveals.forEach((el, idx) => {
        setTimeout(() => el.classList.add("is-visible"), 70 * idx);
      });

      bindPageInteractions(target);
    }

    function bindPageInteractions(route) {
      if (route === "home") {
        const capSlider = document.getElementById("sim-cap");
        const riskSlider = document.getElementById("sim-risk");
        const updateSim = () => {
          const cap = Number(capSlider.value);
          const risk = Number(riskSlider.value);
          const maxLoss = Math.round((cap * risk) / 100);
          const target = maxLoss * 2;
          const remainingPct = Math.max(0, (100 - risk * 10)).toFixed(1);

          document.getElementById("sim-cap-label").textContent = "₹" + cap.toLocaleString("en-IN");
          document.getElementById("sim-risk-label").textContent = risk.toFixed(1) + "%";
          document.getElementById("sim-sl").textContent = "₹" + maxLoss.toLocaleString("en-IN");
          document.getElementById("sim-tgt").textContent = "₹" + target.toLocaleString("en-IN");
          document.getElementById("sim-buf").textContent = remainingPct + "%";
        };
        capSlider.addEventListener("input", updateSim);
        riskSlider.addEventListener("input", updateSim);
      }

      if (route === "curriculum") {
        const filterBar = document.getElementById("module-filters");
        const grid = document.getElementById("modules-grid");
        filterBar.addEventListener("click", (e) => {
          const chip = e.target.closest(".filter-chip");
          if (!chip) return;
          filterBar.querySelectorAll(".filter-chip").forEach((c) => c.classList.remove("active"));
          chip.classList.add("active");
          grid.innerHTML = renderModuleCards(chip.dataset.filter);
        });
      }

      if (route === "faq") {
        document.querySelectorAll(".acc-head").forEach((btn) => {
          btn.addEventListener("click", () => {
            btn.parentElement.classList.toggle("open");
          });
        });
      }

      if (route === "admissions") {
        const form = document.getElementById("admission-form");
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const name = document.getElementById("inp-name").value.trim();

          feedback.textContent = `✓ Thank you, ${name}. Your orientation request with ${INSTITUTE.name} has been logged. Our counseling desk will reach out within 24 working hours.`;
          form.reset();
        });
      }
    }

    document.addEventListener("click", (e) => {

      if (tradeBtn) {
        const rect = tradeBtn.getBoundingClientRect();
        const circle = document.createElement("span");
        const size = Math.max(rect.width, rect.height);
        circle.style.width = circle.style.height = `${size}px`;
        circle.style.left = `${e.clientX - rect.left - size / 2}px`;
        circle.style.top = `${e.clientY - rect.top - size / 2}px`;
        circle.className = "ripple-wave";
        tradeBtn.appendChild(circle);
        setTimeout(() => circle.remove(), 600);
      }

      const routeTrigger = e.target.closest("[data-route]");
      if (routeTrigger) {
        switchPage(routeTrigger.dataset.route);
      }
    });
